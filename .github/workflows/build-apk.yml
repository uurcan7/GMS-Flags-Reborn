name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: APK variant to build
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Build APK
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            ./gradlew :core-entry:assembleRelease
          else
            ./gradlew :core-entry:assembleDebug
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gms-flags-${{ github.event.inputs.build_type }}-apk
          path: core-entry/build/outputs/apk/${{ github.event.inputs.build_type }}/**/*.apk
          if-no-files-found: error
